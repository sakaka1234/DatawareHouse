global:
  scrape_interval: 10s

scrape_configs:
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
  - job_name: agri-exporter
    static_configs:
      - targets: ["agri-exporter:9310"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
